apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-rawabet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-rawabet
  template:
    metadata:
      labels:
        app: backend-rawabet
    spec:
      containers:
        - name: backend-rawabet
          image: amennahali/rawabet-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/rawabet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

            - name: SPRING_DATASOURCE_USERNAME
              value: "root"

            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"

            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"

            - name: SPRING_JPA_SHOW_SQL
              value: "true"